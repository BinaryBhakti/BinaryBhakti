name: Render README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/build_cards.py", ".github/workflows/cards.yml"]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Redraws every card from live contribution data (public data only with GITHUB_TOKEN).
      - name: Render cards (hero, tiles, graph, activity, projects)
        run: python3 scripts/build_cards.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Render README cards" || exit 0
          git push
